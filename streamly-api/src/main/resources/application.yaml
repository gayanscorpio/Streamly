# WHAT: Spring Boot settings file.
# WHY: Configures the database, GraphQL tools, and CORS without writing Java.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/streamly?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: {$PASSSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true # Print every INSERT/SELECT in the console
    properties:
      hibernate:
        format_sql: true

  graphql:
    graphiql:
      enabled: true # Browser playground: http://localhost:8080/graphiql

    cors:
      allowed-origins: "http://localhost:5173,http://localhost:5174"
      allowed-headers: "*" # Allows Authorization and Content-Type.
      allowed-methods: GET,POST